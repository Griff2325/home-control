# Checks every push: the shared core's tests, and that the iPhone app (with its widgets)
# still builds. Nothing is signed or uploaded.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Core tests and iPhone app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The widgets and Control Center controls need the iOS 26 SDK.
      - name: Use Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Core tests
        run: swift test --package-path core

      - name: Build the web UI
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the iPhone app (simulator, unsigned)
        run: |
          cd ios
          xcodegen generate --spec project.yml
          xcodebuild -project HouseControl.xcodeproj -scheme HouseControl \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
          exit "${PIPESTATUS[0]}"
